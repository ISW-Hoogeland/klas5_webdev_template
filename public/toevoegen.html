<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product toevoegen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <a class="logo" href="index.html">Webshop</a>
    <nav>
        <a href="producten.html">Producten</a>
        <a href="toevoegen.html">Toevoegen</a>
        <a href="categorieen.html">Categorieën</a>
    </nav>
</header>
<main>
    <h1>Product toevoegen</h1>
    <form id="productformulier" class="formulier">
        <label for="naam">Naam</label>
        <input id="naam" name="naam" required>

        <label for="prijs">Prijs</label>
        <input id="prijs" name="prijs" type="number" min="0" step="0.01" required>

        <label for="categorie">Categorie</label>
        <select id="categorie" name="categorie_id" required>
            <option value="" disabled selected>Kies een categorie</option>
            <option value="1">Games</option>
            <option value="2">Boeken</option>
            <option value="3">Hardware</option>
            <option value="4">Accessoires</option>
        </select>

        <button type="submit">Product toevoegen</button>
    </form>
    <p id="melding" class="melding" hidden></p>
</main>
<script src="js/toevoegen.js"></script>
</body>
</html>
